server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Telegram/VK mini apps run in an iframe/webview — don't let anything
    # block that with a restrictive frame-ancestors or X-Frame-Options.
    add_header X-Content-Type-Options nosniff;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://backend:8080/swagger/;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — HashRouter means this really only ever serves "/",
    # but keep it correct in case that changes later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
