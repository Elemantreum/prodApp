name: _deploy

on:
  workflow_call:
    inputs:
      service:
        description: Имя сервиса в docker-compose.yml и имя образа
        type: string
        required: true
      version:
        description: Тег образа, который выкатить, например sha-<коммит>
        type: string
        required: true

env:
  DEPLOY_PATH: /srv/prodApp

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check requested version
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || [[ "$VERSION" == "prod" ]]; then
            echo "::error::Недопустимый тег образа: $VERSION"
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null

      - name: Remember current prod image
        id: previous
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:prod" --format '{{json .Manifest}}' | jq -er .digest); then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi

      - name: Point prod tag to ${{ inputs.version }}
        id: retag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE:$VERSION"

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}

      - name: Restart service on server
        id: restart
        uses: appleboy/ssh-action@v1
        env:
          SERVICE: ${{ inputs.service }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: SERVICE,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            docker compose pull "$SERVICE"
            docker compose up -d --wait --remove-orphans "$SERVICE"
            docker image prune -f

      - name: Roll prod tag back
        if: failure() && steps.retag.outcome == 'success' && steps.previous.outputs.digest != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.previous.outputs.digest }}
        run: docker buildx imagetools create -t "$IMAGE:prod" "$IMAGE@$DIGEST"

      - name: Roll service back on server
        if: failure() && steps.restart.outcome == 'failure' && steps.previous.outputs.digest != ''
        uses: appleboy/ssh-action@v1
        env:
          SERVICE: ${{ inputs.service }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: SERVICE,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            docker compose pull "$SERVICE"
            docker compose up -d --wait "$SERVICE"
