name: _build-image

on:
  workflow_call:
    inputs:
      service:
        description: Имя сервиса, оно же имя образа
        type: string
        required: true
      context:
        description: Папка с Dockerfile
        type: string
        required: true
    outputs:
      version:
        description: Тег собранного образа, например sha-<коммит>
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and version
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
