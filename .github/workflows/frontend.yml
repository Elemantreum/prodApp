name: frontend

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/_build-image.yml'
      - '.github/workflows/_deploy.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Тег уже собранного образа для выкатки, например sha-<коммит>
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

  image:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: frontend
      context: frontend

  deploy:
    if: github.event_name == 'push'
    needs: image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy.yml
    with:
      service: frontend
      version: ${{ needs.image.outputs.version }}
    secrets: inherit

  redeploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy.yml
    with:
      service: frontend
      version: ${{ inputs.version }}
    secrets: inherit
