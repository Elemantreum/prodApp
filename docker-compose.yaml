services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: ${DB_PORT}
    expose:
      - ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  tg-notifier:
    build:
      context: .
      dockerfile: tg-notifier/Dockerfile
    env_file:
      - .env
    environment:
      GRPC_PORT: 50051
    expose:
      - "50051"

  vk-notifier:
    build:
      context: .
      dockerfile: vk-notifier/Dockerfile
    env_file:
      - .env
    environment:
      GRPC_PORT: 50052
    expose:
      - "50052"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      TG_NOTIFIER_ADDR: tg-notifier:50051
      VK_NOTIFIER_ADDR: vk-notifier:50052
    depends_on:
      postgres:
        condition: service_healthy
      tg-notifier:
        condition: service_started
      vk-notifier:
        condition: service_started

  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
