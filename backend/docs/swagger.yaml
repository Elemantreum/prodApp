basePath: /api/v1
definitions:
  auth.linkRequest:
    properties:
      code:
        type: string
    type: object
  auth.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.tokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  booking.Booking:
    properties:
      bookingDate:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/booking.BookingStatus'
      trainingId:
        type: integer
      unbookingDate:
        type: string
      userId:
        type: integer
    type: object
  booking.BookingDetail:
    properties:
      bookingDate:
        type: string
      bookingId:
        type: integer
      firstName:
        type: string
      identities:
        items:
          $ref: '#/definitions/user.Identity'
        type: array
      lastName:
        type: string
      status:
        $ref: '#/definitions/booking.BookingStatus'
      userId:
        type: integer
      username:
        type: string
    type: object
  booking.BookingStatus:
    enum:
    - active
    type: string
    x-enum-varnames:
    - Active
  booking.Participant:
    properties:
      bookingDate:
        type: string
      firstName:
        type: string
      identities:
        description: |-
          Identities — привязанные платформы участника (провайдер, внешний id,
          @-хендл если есть) — фронт строит из них ссылки на vk.com/id.../t.me/... .
        items:
          $ref: '#/definitions/user.Identity'
        type: array
      lastName:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  booking.cancelBookingRequest:
    properties:
      bookingId:
        type: integer
    type: object
  booking.setAttendanceRequest:
    properties:
      attended:
        type: boolean
      bookingId:
        type: integer
    type: object
  booking.signUpForTrainingRequest:
    properties:
      trainingId:
        type: integer
    type: object
  training.RecurringTraining:
    properties:
      anchorDate:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      createdAt:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      duration:
        type: integer
      id:
        type: integer
      isActive:
        type: boolean
      leadTime:
        description: |-
          LeadTime — за сколько до даты занятия его нужно создать (материализовать
          в trainings). Например 14 дней — занятие появится в общем списке ровно
          за две недели до начала, а не сразу на весь горизонт вперёд.
        type: integer
      maxQuantity:
        type: integer
    type: object
  training.Training:
    properties:
      bookedCount:
        description: |-
          BookedCount — сколько активных броней сейчас на этой тренировке.
          Считается прямым SQL-джойном на таблицу bookings прямо в репозитории
          (см. PostgresTrainingRepository) — так дешевле, чем гонять по одному
          GetParticipants на каждую карточку с фронта. Пакет booking сюда
          намеренно не импортируется: booking уже импортирует training, так что
          обратная зависимость была бы циклом.
        type: integer
      createdAt:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      date:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      duration:
        type: integer
      id:
        type: integer
      isActive:
        type: boolean
      maxQuantity:
        type: integer
      recurringTrainingId:
        description: |-
          RecurringTrainingId — не nil, если тренировка сгенерирована правилом
          регулярности (см. RecurringTraining). Чисто информационная метка для
          фронта ("повторяется"), на бронирование и редактирование не влияет —
          сгенерированную тренировку можно менять/деактивировать как обычную.
        type: integer
    type: object
  training.createRecurringTrainingRequest:
    properties:
      anchorDate:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      duration:
        type: integer
      leadTime:
        type: integer
      maxQuantity:
        type: integer
    type: object
  training.createTrainingRequest:
    properties:
      date:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      duration:
        type: integer
      maxQuantity:
        type: integer
    type: object
  training.trainingIdRequest:
    properties:
      id:
        type: integer
    type: object
  training.updateRecurringTrainingRequest:
    properties:
      anchorDate:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      duration:
        type: integer
      id:
        type: integer
      isActive:
        type: boolean
      leadTime:
        type: integer
      maxQuantity:
        type: integer
    type: object
  training.updateTrainingRequest:
    properties:
      date:
        example: "2002-10-02T15:00:00Z"
        format: date-time
        type: string
      description:
        type: string
      duration:
        type: integer
      id:
        type: integer
      isActive:
        type: boolean
      maxQuantity:
        type: integer
    type: object
  user.Identity:
    properties:
      createdAt:
        type: string
      externalId:
        type: string
      id:
        type: integer
      provider:
        type: string
      userId:
        type: integer
      username:
        description: |-
          Username — @-хендл на этой платформе, если есть. Сейчас реально
          заполняется только для Telegram (VK не отдаёт его в launch-параметрах;
          для VK ссылка на профиль строится напрямую по ExternalId, username не
          нужен). Обновляется при каждом логине (см. UserService.EnsureProfile) —
          в отличие от имени/фамилии, это чисто техническая деталь для ссылок,
          а не то, что юзер осознанно редактирует.
        type: string
    type: object
  user.identityInfo:
    properties:
      externalId:
        type: string
      provider:
        type: string
    type: object
  user.linkCodeResponse:
    properties:
      code:
        type: string
      expiresAt:
        type: string
    type: object
  user.profileRequest:
    properties:
      firstName:
        type: string
      lastName:
        type: string
      userId:
        type: integer
    type: object
  user.userIdRequest:
    properties:
      userId:
        type: integer
    type: object
  user.userWithIdentities:
    properties:
      createdAt:
        type: string
      firstName:
        type: string
      id:
        type: integer
      identities:
        items:
          $ref: '#/definitions/user.identityInfo'
        type: array
      isAdmin:
        type: boolean
      isApproved:
        type: boolean
      isRegistered:
        description: |-
          IsRegistered — прошёл ли обязательный шаг "как вас зовут" при первом
          входе. Новые аккаунты создаются с false (EnsureProfile) и переводятся в
          true первым же успешным UpdateProfile — неважно, вызван он самим юзером
          с экрана регистрации или админом. Чисто фронтовый гейт: на бронирование
          и прочую бизнес-логику не влияет, в отличие от IsApproved.
        type: boolean
      lastName:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Бэкенд для бронирования тренировок
  title: ProdApp API
  version: "1.0"
paths:
  /auth/logout:
    post:
      consumes:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: refresh_token не указан
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Отозвать refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Ротация: предъявленный refresh token сразу отзывается, взамен
        выдаётся новая пара. Повторное предъявление того же токена (например, украденного)
        больше не сработает.'
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: refresh_token не указан
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: невалидный/истёкший/отозванный refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновить access token по refresh token'у
      tags:
      - auth
  /auth/telegram:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "401":
          description: Unauthorized
      summary: Логин через Telegram Mini App
      tags:
      - auth
  /auth/telegram/link:
    post:
      consumes:
      - application/json
      description: Код берётся из POST /user/linkCode, полученного в сессии ДРУГОЙ
        платформы. После успешной привязки возвращает токен для аккаунта, к которому
        привязали (не нового).
      parameters:
      - description: Код привязки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.linkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: код не указан или истёк
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: невалидные initData
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Привязать Telegram к существующему аккаунту
      tags:
      - auth
  /auth/vk:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "401":
          description: Unauthorized
      summary: Логин через VK Mini App
      tags:
      - auth
  /auth/vk/link:
    post:
      description: Код берётся из POST /user/linkCode, полученного в сессии ДРУГОЙ
        платформы, и передаётся как query-параметр code вместе с обычными launch-параметрами
        VK. После успешной привязки возвращает токен для аккаунта, к которому привязали
        (не нового).
      parameters:
      - description: Код привязки
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokenResponse'
        "400":
          description: код не указан или истёк
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: невалидные launch params
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Привязать VK к существующему аккаунту
      tags:
      - auth
  /booking/admin/getByTrainingId:
    get:
      description: Только для админов. В отличие от getByTrainingId — включает отменённые
        записи и id брони.
      parameters:
      - description: ID тренировки
        in: query
        name: trainingId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/booking.BookingDetail'
            type: array
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Все записи на тренировку (админ)
      tags:
      - booking
  /booking/cancel:
    post:
      consumes:
      - application/json
      description: Доступно администратору для любого бронирования; обычному пользователю
        — только для своего
      parameters:
      - description: ID бронирования
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/booking.cancelBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.Booking'
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: доступ запрещён
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Отменить бронирование
      tags:
      - booking
  /booking/getByTrainingId:
    get:
      description: Доступно любому авторизованному пользователю. Показывает только
        активные записи.
      parameters:
      - description: ID тренировки
        in: query
        name: trainingId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/booking.Participant'
            type: array
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Кто записан на тренировку
      tags:
      - booking
  /booking/getByUserId:
    get:
      description: Доступно администратору для любого пользователя; обычному пользователю
        — только для самого себя
      parameters:
      - description: ID пользователя
        in: query
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/booking.Booking'
            type: array
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: доступ запрещён
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Получить бронирования пользователя
      tags:
      - booking
  /booking/setAttendance:
    post:
      consumes:
      - application/json
      description: Только для админов. Переводит бронь в completed (пришёл) или not_completed
        (не пришёл); отменённую бронь трогать нельзя.
      parameters:
      - description: ID брони и признак посещения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/booking.setAttendanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.Booking'
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: бронь отменена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Отметить посещаемость (админ)
      tags:
      - booking
  /booking/signUp:
    post:
      consumes:
      - application/json
      description: Создаёт бронирование текущего пользователя на тренировку
      parameters:
      - description: ID тренировки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/booking.signUpForTrainingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/booking.Booking'
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: аккаунт ещё не одобрен администратором
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Записаться на тренировку
      tags:
      - booking
  /trainings/create:
    post:
      consumes:
      - application/json
      description: Только для админов
      parameters:
      - description: Данные тренировки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/training.createTrainingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/training.Training'
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Создать тренировку
      tags:
      - trainings
  /trainings/delete:
    post:
      consumes:
      - application/json
      description: Только для админов. Отказывает (409), если на тренировку есть хоть
        одна запись — сначала деактивируйте её через UpdateTraining.
      parameters:
      - description: ID тренировки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/training.trainingIdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: на тренировку есть записи
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Удалить тренировку
      tags:
      - trainings
  /trainings/get:
    get:
      description: Админу — все тренировки, включая неактивные. Остальным авторизованным
        пользователям — только активные.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/training.Training'
            type: array
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Получить список тренировок
      tags:
      - trainings
  /trainings/get/{id}:
    get:
      description: Только для админов
      parameters:
      - description: ID тренировки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/training.Training'
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
      summary: Получить тренировку по ID
      tags:
      - trainings
  /trainings/recurring/create:
    post:
      consumes:
      - application/json
      description: Только для админов. AnchorDate — дата и время первого занятия,
        дальше повторяется каждые 7 дней от неё. Первые занятия материализуются сразу.
      parameters:
      - description: Данные правила
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/training.createRecurringTrainingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/training.RecurringTraining'
        "401":
          description: не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: нет прав администратора
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - OAuth2AccessCode: []
